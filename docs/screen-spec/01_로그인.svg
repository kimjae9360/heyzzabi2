<text x="1518.0" y="471.0" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="16.5" font-weight="400" fill="#334155" text-anchor="start">• bcrypt로 해시 저장(과거 평문 계정은 로그인 성공 시</text>
<text x="1518.0" y="493.5" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="16.5" font-weight="400" fill="#334155" text-anchor="start">  자동 재해시)</text>
<text x="1518.0" y="519.0" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="16.5" font-weight="400" fill="#334155" text-anchor="start">• 값을 잘못 입력하면 하단에 에러 메시지 노출</text>
