<text x="1518.0" y="347.0" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="16.5" font-weight="400" fill="#334155" text-anchor="start">• @heyzzabi.com 도메인이 붙는 사내 계정만 사용</text>
<text x="1518.0" y="372.5" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="16.5" font-weight="400" fill="#334155" text-anchor="start">• 회사(PM)가 발급한 계정으로만 로그인 가능, 자체 가입 불가</text>
<line x1="1474.0" y1="416.0" x2="2072.0" y2="416.0" stroke="#e2e8f0" stroke-width="1"/>
