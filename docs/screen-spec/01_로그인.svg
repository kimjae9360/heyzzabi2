<text x="1518.0" y="764.0" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="16.5" font-weight="400" fill="#334155" text-anchor="start">• PM(관리자): 아이디 pm / 비번 admin</text>
