<text x="1510.0" y="202.0" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="21" font-weight="700" fill="#0f172a" text-anchor="start">화면. B2B 전용 서비스로 자체 회원가입</text>
