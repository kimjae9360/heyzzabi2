<text x="1518.0" y="617.5" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="16.5" font-weight="400" fill="#334155" text-anchor="start">• 성공 시 HttpOnly 서명 쿠키 세션</text>
<text x="1518.0" y="640.0" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="16.5" font-weight="400" fill="#334155" text-anchor="start">  발급(src/lib/session.ts, HMAC 자체 서명)</text>
<text x="1518.0" y="665.5" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="16.5" font-weight="400" fill="#334155" text-anchor="start">• 역할(PM/MEMBER)에 따라 이후 대시보드 뷰가 분기됨</text>
