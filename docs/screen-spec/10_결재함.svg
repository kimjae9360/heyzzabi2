<circle cx="1487" cy="634" r="15" fill="#f5a623" stroke="#fff" stroke-width="2"/><text x="1487.0" y="639.1" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">04</text>
<text x="1512.0" y="629.0" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="700" fill="#0f172a" text-anchor="start">요청 클릭 → 원본 이동</text>
<text x="1518.0" y="665.0" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="16.5" font-weight="400" fill="#334155" text-anchor="start">• 클릭 시 해당 업무/프로젝트로 이동</text>
