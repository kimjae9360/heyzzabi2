<text x="1512.0" y="311.0" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="700" fill="#0f172a" text-anchor="start">대기 중인 요청 리스트</text>
<text x="1518.0" y="347.0" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="16.5" font-weight="400" fill="#334155" text-anchor="start">• 요청이 없을 때는 빈 상태 안내 문구 노출</text>
<line x1="1474.0" y1="390.5" x2="2072.0" y2="390.5" stroke="#e2e8f0" stroke-width="1"/>
