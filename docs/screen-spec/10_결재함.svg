<text x="1512.0" y="409.5" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="700" fill="#0f172a" text-anchor="start">승인 버튼</text>
<text x="1518.0" y="445.5" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="16.5" font-weight="400" fill="#334155" text-anchor="start">• 승인 시 업무 상태가 진행중(IN_PROGRESS)으로 전환</text>
<line x1="1474.0" y1="489.0" x2="2072.0" y2="489.0" stroke="#e2e8f0" stroke-width="1"/>
<circle cx="1487" cy="513" r="15" fill="#f5a623" stroke="#fff" stroke-width="2"/><text x="1487.0" y="518.1" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">03</text>
<text x="1512.0" y="508.0" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="700" fill="#0f172a" text-anchor="start">반려 버튼</text>
<text x="1518.0" y="544.0" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="16.5" font-weight="400" fill="#334155" text-anchor="start">• 반려 시 대기(BACKLOG)로 되돌리고 담당자 해제, 반려</text>
<text x="1518.0" y="566.5" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="16.5" font-weight="400" fill="#334155" text-anchor="start">  사유 입력이 필수</text>
