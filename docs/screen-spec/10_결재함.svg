<text x="1486.0" y="181.0" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">#</text>
<text x="1510.0" y="176.0" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="21" font-weight="700" fill="#0f172a" text-anchor="start">PM이 팀원의 배분 승인 요청을 처리하는 큐.</text>
<text x="1510.0" y="202.0" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="21" font-weight="700" fill="#0f172a" text-anchor="start">업무관리 칸반의 배분승인대기 컬럼과 동일한</text>
<text x="1510.0" y="228.0" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="21" font-weight="700" fill="#0f172a" text-anchor="start">목록이다.</text>
