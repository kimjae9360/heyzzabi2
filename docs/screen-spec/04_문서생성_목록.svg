<text x="1512.0" y="311.0" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="700" fill="#0f172a" text-anchor="start">상단 탭: 기획서 / 요구사항정의서 / 업무 배분</text>
<text x="1518.0" y="347.0" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="16.5" font-weight="400" fill="#334155" text-anchor="start">• 요구사항정의서 탭은 기획서 승인 후에만 진입 가능</text>
<text x="1518.0" y="372.5" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="16.5" font-weight="400" fill="#334155" text-anchor="start">• 업무 배분 탭은 요구사항정의서 승인 후에만 노출</text>
<line x1="1474.0" y1="416.0" x2="2072.0" y2="416.0" stroke="#e2e8f0" stroke-width="1"/>
<circle cx="1487" cy="440" r="15" fill="#f5a623" stroke="#fff" stroke-width="2"/><text x="1487.0" y="445.1" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">02</text>
<text x="1512.0" y="435.0" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="700" fill="#0f172a" text-anchor="start">새 회의록 / 문서 버튼</text>
<text x="1518.0" y="471.0" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="16.5" font-weight="400" fill="#334155" text-anchor="start">• 좌: 파일 첨부(.txt/.md/.docx/.pdf) / 우:</text>
<text x="1518.0" y="493.5" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="16.5" font-weight="400" fill="#334155" text-anchor="start">  직접 입력 2단 모달</text>
<text x="1518.0" y="519.0" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="16.5" font-weight="400" fill="#334155" text-anchor="start">• 파일 첨부 시 파싱된 텍스트가 우측 입력창에 자동 반영</text>
<line x1="1474.0" y1="562.5" x2="2072.0" y2="562.5" stroke="#e2e8f0" stroke-width="1"/>
<circle cx="1487" cy="586.5" r="15" fill="#f5a623" stroke="#fff" stroke-width="2"/><text x="1487.0" y="591.6" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">03</text>
<text x="1512.0" y="581.5" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="700" fill="#0f172a" text-anchor="start">상태 필터 칩</text>
<text x="1518.0" y="617.5" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="16.5" font-weight="400" fill="#334155" text-anchor="start">• 전체 · 검토요청중 · 승인됨 · 반려됨, 각 건수 표시</text>
<line x1="1474.0" y1="661.0" x2="2072.0" y2="661.0" stroke="#e2e8f0" stroke-width="1"/>
<circle cx="1487" cy="685" r="15" fill="#f5a623" stroke="#fff" stroke-width="2"/><text x="1487.0" y="690.1" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">04</text>
<text x="1512.0" y="680.0" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="700" fill="#0f172a" text-anchor="start">문서 카드 리스트</text>
<text x="1518.0" y="716.0" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="16.5" font-weight="400" fill="#334155" text-anchor="start">• 회의록 제목 · 상태 배지(미생성/배분필요/배분완료/반려됨)</text>
<text x="1518.0" y="738.5" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="16.5" font-weight="400" fill="#334155" text-anchor="start">  · 등록일</text>
<text x="1518.0" y="764.0" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="16.5" font-weight="400" fill="#334155" text-anchor="start">• PM 화면에서는 검토요청 전(DRAFT) 문서는 숨김 처리</text>
