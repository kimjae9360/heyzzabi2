<text x="1510.0" y="176.0" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="21" font-weight="700" fill="#0f172a" text-anchor="start">회의록을 등록하면 AI가</text>
<text x="1510.0" y="202.0" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="21" font-weight="700" fill="#0f172a" text-anchor="start">기획서→요구사항정의서→업무배분까지 이어서</text>
<text x="1510.0" y="228.0" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="21" font-weight="700" fill="#0f172a" text-anchor="start">만들어주는 파이프라인의 시작 화면.</text>
