<text x="1474.0" y="124.0" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="24" font-weight="700" fill="#ffffff" text-anchor="start">Description</text>
<circle cx="1486" cy="176" r="13" fill="#94a3b8"/>
<text x="1486.0" y="181.0" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">#</text>
<text x="1510.0" y="176.0" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="21" font-weight="700" fill="#0f172a" text-anchor="start">선택한 회의록을 바탕으로 AI가</text>
<text x="1510.0" y="202.0" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="21" font-weight="700" fill="#0f172a" text-anchor="start">기획서·요구사항정의서를 생성하고, PM이</text>
<text x="1510.0" y="228.0" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="21" font-weight="700" fill="#0f172a" text-anchor="start">검토/승인/반려하는 화면.</text>
<line x1="1474.0" y1="282.0" x2="2072.0" y2="282.0" stroke="#e2e8f0" stroke-width="1"/>
<circle cx="1487" cy="316" r="15" fill="#f5a623" stroke="#fff" stroke-width="2"/><text x="1487.0" y="321.1" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">01</text>
<text x="1512.0" y="311.0" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="700" fill="#0f172a" text-anchor="start">원본 회의록/메모 표시 영역</text>
<text x="1518.0" y="347.0" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="16.5" font-weight="400" fill="#334155" text-anchor="start">• 기획서 생성 전엔 펼침, 생성 후엔 접기 토글 가능</text>
<text x="1518.0" y="372.5" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="16.5" font-weight="400" fill="#334155" text-anchor="start">• 요구사항정의서 탭에서는 표시하지 않음</text>
<line x1="1474.0" y1="416.0" x2="2072.0" y2="416.0" stroke="#e2e8f0" stroke-width="1"/>
<circle cx="1487" cy="440" r="15" fill="#f5a623" stroke="#fff" stroke-width="2"/><text x="1487.0" y="445.1" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">02</text>
<text x="1512.0" y="435.0" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="700" fill="#0f172a" text-anchor="start">AI 기획서 생성 버튼(AGENT)</text>
<text x="1518.0" y="471.0" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="16.5" font-weight="400" fill="#334155" text-anchor="start">• gpt-4o-mini 호출,</text>
<text x="1518.0" y="493.5" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="16.5" font-weight="400" fill="#334155" text-anchor="start">  NO_HALLUCINATION_RULE로 원본 외 내용 생성을</text>
<text x="1518.0" y="516.0" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="16.5" font-weight="400" fill="#334155" text-anchor="start">  금지</text>
<text x="1518.0" y="541.5" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="16.5" font-weight="400" fill="#334155" text-anchor="start">• temperature는 /settings의 에이전트 설정에서</text>
<text x="1518.0" y="564.0" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="16.5" font-weight="400" fill="#334155" text-anchor="start">  읽어옴(서버 0~0.3 강제 clamp)</text>
<line x1="1474.0" y1="607.5" x2="2072.0" y2="607.5" stroke="#e2e8f0" stroke-width="1"/>
<circle cx="1487" cy="631.5" r="15" fill="#f5a623" stroke="#fff" stroke-width="2"/><text x="1487.0" y="636.6" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">03</text>
<text x="1512.0" y="626.5" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="700" fill="#0f172a" text-anchor="start">문서 본문(ProposalTemplate)</text>
<text x="1518.0" y="662.5" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="16.5" font-weight="400" fill="#334155" text-anchor="start">• 반려된 문서는 PM이 AI 재생성 없이 직접</text>
<text x="1518.0" y="685.0" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="16.5" font-weight="400" fill="#334155" text-anchor="start">  수정(editable) 가능</text>
<text x="1518.0" y="710.5" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="16.5" font-weight="400" fill="#334155" text-anchor="start">• 저장 시 상태는 DRAFT로 복귀되고 반려사유는 초기화</text>
<line x1="1474.0" y1="754.0" x2="2072.0" y2="754.0" stroke="#e2e8f0" stroke-width="1"/>
<circle cx="1487" cy="778" r="15" fill="#f5a623" stroke="#fff" stroke-width="2"/><text x="1487.0" y="783.1" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">04</text>
<text x="1512.0" y="773.0" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="700" fill="#0f172a" text-anchor="start">검토요청 / 승인 / 반려 버튼</text>
<text x="1518.0" y="809.0" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="16.5" font-weight="400" fill="#334155" text-anchor="start">• MEMBER가 검토요청 → PM이 승인 또는 반려(사유 필수)</text>
<text x="1518.0" y="834.5" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="16.5" font-weight="400" fill="#334155" text-anchor="start">• 기획서 승인과 요구사항정의서 승인은 서로 독립적인 게이트</text>
<line x1="1474.0" y1="878.0" x2="2072.0" y2="878.0" stroke="#e2e8f0" stroke-width="1"/>
<circle cx="1487" cy="902" r="15" fill="#f5a623" stroke="#fff" stroke-width="2"/><text x="1487.0" y="907.1" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">05</text>
<text x="1512.0" y="897.0" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="700" fill="#0f172a" text-anchor="start">PDF / PPTX 출력</text>
<text x="1518.0" y="933.0" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="16.5" font-weight="400" fill="#334155" text-anchor="start">• 문서는 브라우저 인쇄로 PDF, 기획서는 pptxgenjs로</text>
